name: Refresh ORS dashboards

on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.zip'
      - 'incoming/**/*.zip'
      - 'v13/incoming/*.zip'
      - 'v13/incoming/**/*.zip'
      - 'v15/**'
      - '.github/workflows/refresh-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ors-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v13/requirements-ingest.txt
      - run: python -m pip install -r v13/requirements-ingest.txt
      - name: Validate ZIPs and build Excel and site
        run: python v15/refresh_site.py --site "$RUNNER_TEMP/site" --work "$RUNNER_TEMP/work"
      - name: Verify source coverage and detailed pages
        run: python v15/verify_v15.py --site "$RUNNER_TEMP/site"
      - name: Save generated deliverables in Git
        run: |
          mkdir -p v15/data v15/details
          cp -a "$RUNNER_TEMP/site/v15/data/." v15/data/
          cp -a "$RUNNER_TEMP/site/v15/details/." v15/details/
          cp "$RUNNER_TEMP/site/v15/manifest.json" v15/manifest.json
          cp "$RUNNER_TEMP/site/v15/외부사업_통합관리_v15.xlsx" v15/외부사업_통합관리_v15.xlsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v15/data v15/details v15/manifest.json v15/외부사업_통합관리_v15.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "Refresh ORS data, dashboard and Excel"
            git push
          fi
